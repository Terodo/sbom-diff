name: Build and attest

# Reusable workflow: builds the distributions and attests them (SLSA build
# provenance + SBOM). Callers cannot influence the build or forge the
# attestation, which is what SLSA Build L3 requires.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git tags
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - run: uv build

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*
          sbom-path: sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            sbom.cdx.json
          if-no-files-found: error
