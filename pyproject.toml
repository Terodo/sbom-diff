[project]
name = "sbom-diff"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
description = "Compare SBOMs (CycloneDX, SPDX) and get a structured diff."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sbom-diff = "sbom_diff.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Untagged builds get a unique, PyPI-valid dev version (no "+g<sha>" suffix).
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/sbom_diff"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
